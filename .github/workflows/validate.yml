name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Typecheck, lint, test, and Expo Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Expo Doctor
        run: npx expo-doctor
